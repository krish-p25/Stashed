    }

    <!-- ── Structured Data: SoftwareApplication ──────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Stashed",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",

    <!-- ── Structured Data: FAQPage ──────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Stashed?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stashed is an online shared photo album and media collection platform for events. You create an event page, share a QR code or link with your guests, and they can upload photos and videos instantly — no app required."
          }
        },
        {
          "@type": "Question",
          "name": "Do guests need to download an app to upload photos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Guests simply scan a QR code or open a link on their phone and upload directly from their camera roll. No account, no app download, no login required."
          }
        },
        {
          "@type": "Question",
          "name": "Is Stashed good for wedding photo sharing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Stashed is ideal for wedding photo sharing. Print QR codes for tables, guests upload their candid moments throughout the day, and you have a complete shared photo album ready by the next morning — alongside your professional photographer's shots."
          }
        },
        {
          "@type": "Question",
          "name": "What types of events work with Stashed?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Stashed works for any event: weddings, birthday parties, corporate events, conferences, graduations, music festivals, sporting events, and family gatherings. Any time you want to collect photos and videos from multiple people in one place."
          }
        },
        {
          "@type": "Question",
          "name": "How do guests upload photos to Stashed?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You share a unique QR code or link for your event. Guests scan it on their phone, tap Upload, and select photos or videos from their camera roll. Everything goes directly into your event's media collection."
          }
        },
        {
          "@type": "Question",
          "name": "Can I download all the photos after my event?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. After your event you can review, approve or hide uploads, then download everything as a batch. You can also sync directly to Google Drive for automatic storage."
          }
        },
        {
          "@type": "Question",
          "name": "Is Stashed a video platform too?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Stashed supports both photo and video uploads from guests. Your event media collection can include any mix of photos and video clips from all your attendees."
          }
        }
      ]
    }
    </script>

    <!-- ── Structured Data: ItemList (Use Cases) ──────────────────────────────── -->
